name: Deploy Lambda

on:
  push:
    branches: [main]
    paths: [lambda_function.py]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show OIDC claims (debug)
        run: |
          T=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c "import sys,json,base64;p=sys.argv[1].split('.')[1];p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print(c['sub'],c['aud'])" "$T"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::107368385134:role/github-deploy-privacy-coins
          aws-region: us-east-2

      - name: Zip the code
        run: zip function.zip lambda_function.py

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name privacy-coin-fetcher \
            --zip-file fileb://function.zip